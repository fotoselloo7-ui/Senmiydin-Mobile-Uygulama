; Photos have no size limit for people: ordinary camera uploads must pass. The app and the server both scale photos down.
; Read by PHP-FPM / CGI hosting (cPanel). If the host ignores it, set the same values in cPanel > MultiPHP INI Editor.
upload_max_filesize = 20M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
