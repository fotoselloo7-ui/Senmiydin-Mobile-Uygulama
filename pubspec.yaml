name: senmiydin
description: SenMiydin? Şehir odaklı mobil paylaşım uygulaması.
publish_to: none
version: 0.1.0+12
environment:
  sdk: ^3.13.3
dependencies:
  crypto: 3.0.7
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: 2.2.4
  geolocator: ^14.1.2
  google_sign_in: 7.2.0
  http: ^1.6.0
  intl: any
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  package_info_plus: 10.2.2
  share_plus: ^13.3.1
  sign_in_with_apple: 8.2.0
  url_launcher: ^6.3.3
  # Official store review prompts (Google Play In-App Review / StoreKit). MIT, verified publisher (britannio.dev).
  in_app_review: ^2.0.12
  # Opens the app from a shared https://<domain>/p/<id> link (Android App Links / iOS Universal Links). Apache-2.0.
  app_links: ^7.2.2
  # Per-account review-invite bookkeeping (also used by the emoji picker's recents).
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  google_mobile_ads: ^9.2.0
  emoji_picker_flutter: ^4.5.4
  record: ^7.2.0
  audioplayers: ^6.8.1
  image: ^4.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/mark.svg
    - assets/images/
    - assets/gifts/
    - assets/fonts/OFL.txt
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
