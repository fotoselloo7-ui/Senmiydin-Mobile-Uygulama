name: senmiydin
description: SenMiydin? Şehir odaklı mobil paylaşım uygulaması.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.3
dependencies:
  crypto: 3.0.7
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: 2.2.4
  geolocator: ^14.1.2
  google_sign_in: 7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  package_info_plus: 10.2.2
  share_plus: ^13.3.1
  sign_in_with_apple: 8.2.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/mark.svg
    - assets/images/
    - assets/fonts/OFL.txt
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
