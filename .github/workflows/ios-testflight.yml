name: iOS TestFlight

# Builds a signed App Store IPA on a macOS runner and uploads it to App Store Connect (TestFlight).
# Manual only (Actions > iOS TestFlight > Run workflow). Required repository secrets are listed in docs/IOS_TESTFLIGHT_CI.md;
# the job stops immediately with a clear message when one is missing. Nothing secret is ever committed.

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          S4: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          S5: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S6: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S7: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          S8: ${{ secrets.IOS_OAUTH_XCCONFIG_BASE64 }}
          S9: ${{ secrets.PRODUCTION_CONFIG_JSON_BASE64 }}
        run: |
          missing=""
          for n in 4 5 6 7 8 9; do
            v="S$n"
            if [ -z "${!v}" ]; then missing="$missing S$n"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets (see docs/IOS_TESTFLIGHT_CI.md):$missing"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Restore ignored configuration files
        env:
          PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          OAUTH_B64: ${{ secrets.IOS_OAUTH_XCCONFIG_BASE64 }}
          CONFIG_B64: ${{ secrets.PRODUCTION_CONFIG_JSON_BASE64 }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          printf '%s' "$OAUTH_B64" | base64 --decode > ios/Flutter/OAuth.xcconfig
          mkdir -p config
          printf '%s' "$CONFIG_B64" | base64 --decode > config/production.local.json
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Prepare Flutter iOS build
        run: |
          flutter build ios --release --no-codesign             --build-number=$((GITHUB_RUN_NUMBER + 10))             --dart-define-from-file=config/production.local.json

      - name: Create unsigned archive (signing happens at export, which needs no registered devices)
        run: |
          set -euo pipefail
          xcodebuild             -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/Runner.xcarchive"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=7YH3522U6V             archive

      - name: Strip vendor signatures from embedded frameworks (export re-signs them with our distribution identity)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          for f in "$APP"/Frameworks/*.framework; do
            echo "== $f"; codesign -dv "$f" 2>&1 | grep -E "Authority|TeamIdentifier|not signed" | head -3 || true
            codesign --remove-signature "$f" || true
          done

      - name: Export and upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>7YH3522U6V</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/Runner.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"             -authenticationKeyID "$API_KEY_ID"             -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senmiydin-ios-export
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 7
